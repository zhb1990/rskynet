[workspace]
resolver = "3"
members = ["crates/*", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/zhb1990/rskynet"

# 统一管理依赖版本，后续新增 rskynet-cluster 等成员时直接复用
[workspace.dependencies]
rskynet-bootstrap = { version = "0.1.0", path = "crates/rskynet-bootstrap" }
rskynet-cluster = { version = "0.1.0", path = "crates/rskynet-cluster" }
rskynet-core = { version = "0.1.0", path = "crates/rskynet-core" }
rskynet-dashboard = { version = "0.1.0", path = "crates/rskynet-dashboard" }
rskynet-logger = { version = "0.1.0", path = "crates/rskynet-logger" }
rskynet-http = { version = "0.1.0", path = "crates/rskynet-http" }
rskynet-macros = { version = "0.1.0", path = "crates/rskynet-macros" }
rskynet-net = { version = "0.1.0", path = "crates/rskynet-net" }
rskynet-quic = { version = "0.1.0", path = "crates/rskynet-quic" }
rskynet-signal = { version = "0.1.0", path = "crates/rskynet-signal" }
rskynet-timer = { version = "0.1.0", path = "crates/rskynet-timer" }
rskynet-tls = { version = "0.1.0", path = "crates/rskynet-tls" }

arc-swap = "1"
async-trait = "0.1"
backtrace = "0.3"
crossbeam-queue = "0.3"
crash-handler = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3.5"
futures-executor = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
inventory = "0.3"
libc = "0.2"
minidump = "=0.25.0"
minidump-processor = "=0.25.0"
minidump-unwind = { version = "=0.25.0", features = ["debuginfo-unwind"] }
minidumper = "0.9"
mio = { version = "1", features = ["os-poll", "net"] }
parking_lot = "0.12"
prost = "0.14"
bytes = "1"
quinn-proto = "=0.11.17"
pkcs8 = { version = "0.11", features = ["encryption", "getrandom", "pem"] }
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"
rustls-pemfile = "2"
rustls-platform-verifier = "0.7"
webpki-roots = "1"
zeroize = { version = "1", features = ["alloc"] }
signal-hook = "0.4"
slab = "0.4"
syn = { version = "2", features = ["full"] }
thiserror = "2"
toml = "0.9"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq-proto = "0.6"

# 统一 fail-fast：普通 panic="abort" 仍会执行 panic hook，崩溃信息由 rskynet-signal 记录。
# 不要改成 immediate-abort，那会跳过 hook。cargo test 的 harness 仍强制 unwind。
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
