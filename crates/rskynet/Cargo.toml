[package]
name = "rskynet"
description = "用 Rust 复刻 skynet 的 Actor 内核：内核、宏与各服务包的统一入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["macros", "logger", "timer", "bootstrap", "signal", "main"]
# 服务样板宏。默认打开，因为它是写服务的常规姿势
macros = ["dep:rskynet-macros"]
# 日志服务。关掉之后 ctx.log 退回 stderr
logger = ["dep:rskynet-logger"]
# 定时器：时间轮加时间来源。关掉就得自己实现 Timer 并注入，否则节点起不来
timer = ["dep:rskynet-timer"]
# 引导服务。关掉之后要自己拉起第一个业务服务
bootstrap = ["dep:rskynet-bootstrap"]
# 进程信号、优雅关停与独立崩溃报告进程
signal = ["dep:rskynet-signal"]
# 标准命令行入口：读取 TOML，并从链接进来的服务构造自动注册表
main = []
# 网络层。要用 socket / gate 时打开
net = ["dep:rskynet-net"]
# TLS 协议服务，密文收发依赖底层网络服务
tls = ["net", "dep:rskynet-tls"]
# HTTP/1.1 客户端服务与明文嵌入式服务端
http = ["net", "dep:rskynet-http"]
# 节点统计 HTTP API 与内嵌 Dashboard
dashboard = ["http", "dep:rskynet-dashboard"]
# 为 HTTP 层增加 HTTPS 客户端与 TLS 服务端传输
https = ["http", "tls", "rskynet-http/tls"]
# WebSocket 协议；wss 另外组合 `https` feature
websocket = ["http", "rskynet-http/websocket"]
# 跨节点通信：按需开启，同时带上底层网络服务
cluster = ["net", "bootstrap", "dep:rskynet-cluster", "dep:toml"]

# net 在 dev-dependencies 里也列一份，好让 `cargo test` 不加 feature 也跑网络层的
# 用例——那些用例直接用 `rskynet_net`，不经过 `rskynet::net` 那个 re-export
[dev-dependencies]
rskynet-net = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[[test]]
name = "cluster"
path = "tests/cluster.rs"
required-features = ["cluster"]

[[test]]
name = "cluster_auto_duplicate"
path = "tests/cluster_auto_duplicate.rs"
required-features = ["cluster"]

[dependencies]
rskynet-core = { workspace = true }
rskynet-dashboard = { workspace = true, optional = true }
rskynet-bootstrap = { workspace = true, optional = true }
rskynet-cluster = { workspace = true, optional = true }
rskynet-logger = { workspace = true, optional = true }
rskynet-http = { workspace = true, optional = true }
rskynet-macros = { workspace = true, optional = true }
rskynet-net = { workspace = true, optional = true }
rskynet-signal = { workspace = true, optional = true }
rskynet-timer = { workspace = true, optional = true }
rskynet-tls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
