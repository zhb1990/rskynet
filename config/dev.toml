# rskynet 节点配置，对照 skynet 的 config 文件。

# 共享 worker 线程数。不写则取 CPU 核数。
# 日志、信号与定时器各自独占一条线程，不算在这里面。
thread = 4

# 是否统计各服务的消息处理情况。
profile = true

# 内核认的散键只有上面这两个，剩下的一律是段。顶层出现别的散键一律按「拼错了
# 内核字段」处理，启动时就会报错。TOML 的规矩是段一开就管到下一个段为止，所以
# 散键都得写在最前面。
#
# 每个服务各认领一段，自己在 init 里用 ctx.node().section("段名") 解析。内核只
# 从系统服务那四段里读一个 name（该用哪个服务类型），其余内容一概不看。

# 日志服务。整段不写就按默认来：类型名 logger，只写标准输出。
[logger]
# 服务类型名。换成自己的实现就改这里，留空表示不起日志服务（退回 stderr）。
name = "logger"
# 日志文件路径。留空则只写标准输出。
path = ""
# 最多保留多少条待写日志；超过后丢弃较旧日志，恢复时输出丢弃汇总。0 表示不限制。
max_queue = 10000

# 进程信号。整段不写就会启动内置信号服务：Unix 的 SIGINT/SIGTERM 与 Windows
# 的 Ctrl+C 默认优雅关停；用 #[rskynet::signal(...)] 注册后覆盖对应默认行为。
[signal]
name = "signal"

# 定时器。整段不写就按默认来：类型名 timer，2.5 毫秒一个 tick。
[timer]
name = "timer"
# 两次醒来之间隔多少微秒。刻度精度是 10ms，2.5ms 醒一次绰绰有余。
tick_micros = 2500

# 引导配置。整段不写就按默认来：类型名 bootstrap，不拉起任何业务服务。
[bootstrap]
# 引导服务的类型名。换成自己的实现就改这里。
name = "bootstrap"

# 引导清单，写在前面的先起：pong 在 init 里注册好 .pong，ping 才查得到它。
# args 是原样交给服务 init 的那个字符串参数，不需要就不写。
services = [
    { name = "pong" },
    { name = "ping", args = "100" },
]

# 网络层。它不是系统服务，只有同时在 bootstrap 清单中写 `{ name = "net" }` 才会启动。
[net]
# 一轮 poll 最多预留多少个事件。
events = 1024
# socket 槽位数；id 对这个数取模得到 poll token。
max_socket = 65536
# 每条 TCP 流的初始/最小读缓冲字节数，读满时会自适应翻倍。
min_read_buffer = 64
# 单连接写缓冲第一次告警的字节数，之后每翻一倍再告警。
warn_size = 1048576
