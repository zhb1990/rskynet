# rskynet 节点配置，对照 skynet 的 config 文件。

# worker 线程数。不写则取 CPU 核数。
thread = 4

# 本节点编号，占据 handle 的高 8 位，跨节点通信时用来判断是否需要转发。
harbor = 0

# 引导服务，格式是「类型名 参数」。
# 内置的 bootstrap 会把参数按 `;` 拆开，逐个拉起。
bootstrap = "bootstrap pong; ping 100"

# 日志服务的类型名。
logservice = "logger"

# 传给日志服务的参数：日志文件路径。留空则只写标准输出。
logger = ""

# 是否统计各服务的消息处理情况。
profile = true

# 插件的配置各占一段，内核只负责原样传过去，由插件自己解析。
# 网络层（rskynet-net）读的就是 [net] 这一段：
#
# [net]
# listen = "0.0.0.0:8888"
#
# 顶层的散键一律按「拼错了内核字段」处理，启动时就会报错。
